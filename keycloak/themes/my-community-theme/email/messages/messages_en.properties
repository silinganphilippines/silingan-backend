executeActionsSubject=Activate Your Silingan Community Admin Account

# Args used by Keycloak: {0}=link, {1}=linkExpiration number, {2}=realmName, {3}=requiredActions text, {4}=formatted expiration
executeActionsBody=Hello,\n\nWelcome to Silingan!\n\nYou have been invited to serve as the Community Admin.\n\nAs a Community Admin, you'll be able to:\n- Manage your community's profile and settings\n- Create and publish announcements\n- Manage staff accounts and permissions\n- Maintain the community directory and emergency contacts\n- Monitor and manage resident reports\n- Oversee day-to-day community operations\n\nTo get started, please activate your account by clicking the link below:\n\n{0}\n\nFor security reasons, this invitation link will expire within {4}. If it expires, please contact your Silingan administrator to request a new invitation.\n\nIf you weren't expecting this invitation, you may safely ignore this email.\nWe look forward to helping you build a more connected and responsive community.\n\nWarm regards,\nThe Silingan Team

executeActionsBodyHtml=<p>Hello,</p><p>Welcome to Silingan!</p><p>You have been invited to serve as the <strong>Community Admin</strong>.</p><p>As a Community Admin, you’ll be able to:</p><ul><li>Manage your community’s profile and settings</li><li>Create and publish announcements</li><li>Manage staff accounts and permissions</li><li>Maintain the community directory and emergency contacts</li><li>Monitor and manage resident reports</li><li>Oversee day-to-day community operations</li></ul><p>To get started, please activate your account by clicking the button below.</p><p><a href="{0}" style="display:inline-block;padding:12px 20px;background:#0a2e11;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">Activate My Account</a></p><p>For security reasons, this invitation link will expire within <strong>{4}</strong>. If it expires, please contact your Silingan administrator to request a new invitation.</p><p>If you weren’t expecting this invitation, you may safely ignore this email.<br/>We look forward to helping you build a more connected and responsive community.</p><p>Warm regards,<br/><strong>The Silingan Team</strong></p>

